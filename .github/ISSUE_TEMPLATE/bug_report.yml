name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: python
    attributes:
      label: Python and mcp versions
      placeholder: "python 3.12.6, mcp 2.2.0 (python -m pip show mcp)"
  - type: input
    id: claude
    attributes:
      label: Claude desktop version
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or button output
      description: The output from ⋯ → Show output helps a lot. Remove anything private first.
