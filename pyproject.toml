[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-buttons"
dynamic = ["version"]
description = "A button bar for the Claude desktop app, filled by Claude itself."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Environment :: Win32 (MS Windows)",
]

[project.urls]
Homepage = "https://github.com/pierrosimonestd-cpu/claude-buttons"
Issues = "https://github.com/pierrosimonestd-cpu/claude-buttons/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["claude_buttons"]

[tool.setuptools.dynamic]
version = { attr = "claude_buttons.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
